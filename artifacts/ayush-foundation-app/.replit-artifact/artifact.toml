kind = "web"
previewPath = "/"
title = "Ayush Foundation"
description = "A pharmacy and healthcare foundation website imported from the Ayush Foundation repository, with medicine browsing, services, contact pathways, and an admin area."
version = "1.0.0"
id = "artifacts/ayush-foundation-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20234

[services.development]
run = "pnpm --filter @workspace/ayush-foundation-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-foundation-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-foundation-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20234"
BASE_PATH = "/"
