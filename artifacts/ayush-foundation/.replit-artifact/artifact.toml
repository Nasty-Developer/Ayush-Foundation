kind = "web"
previewPath = "/"
title = "Ayush Medico"
description = "A trusted local pharmacy website and admin experience imported from the Ayush Foundation GitHub project."
version = "1.0.0"
id = "artifacts/ayush-foundation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21712

[services.development]
run = "pnpm --filter @workspace/ayush-foundation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-foundation", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-foundation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21712"
BASE_PATH = "/"
