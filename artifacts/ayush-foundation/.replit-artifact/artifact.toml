kind = "web"
previewPath = "/"
title = "Ayush Foundation"
description = "A pharmacy and healthcare foundation website imported from a public GitHub repository, with medicine browsing, services, contact pathways, and an admin area."
version = "1.0.0"
id = "artifacts/ayush-foundation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21712

[services.development]
run = "pnpm --filter @workspace/ayush-foundation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-foundation", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-foundation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21712"
BASE_PATH = "/"
