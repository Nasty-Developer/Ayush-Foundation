kind = "web"
previewPath = "/"
title = "Ayush Medico"
description = "A trusted local pharmacy website and admin experience imported from the Ayush Foundation GitHub project."
version = "1.0.0"
id = "artifacts/ayush-medico"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/ayush-medico run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-medico", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-medico/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
