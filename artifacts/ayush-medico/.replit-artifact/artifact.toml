kind = "web"
previewPath = "/ayush-medico/"
title = "Ayush Medico (secondary)"
description = "Secondary imported copy of the Ayush Medico pharmacy website."
version = "1.0.0"
id = "artifacts/ayush-medico"
router = "path"

[[services]]
name = "web"
paths = [ "/ayush-medico/" ]
localPort = 18169

[services.development]
run = "pnpm --filter @workspace/ayush-medico run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ayush-medico", "run", "build" ]
serve = "static"
publicDir = "artifacts/ayush-medico/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18169"
BASE_PATH = "/ayush-medico/"
